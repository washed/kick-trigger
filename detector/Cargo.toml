[package]
name = "hit-detector"
version = "0.1.0"
edition = "2021"

[features]
diagnostics = []

[dependencies]
embassy-sync = "0.8.0"
ringbuf = { version = "0.5.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", features = ["postcard-derive"] }
heapless = { version = "0.7", features = ["defmt"] }
